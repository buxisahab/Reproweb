<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>CYBERLAB 3D | Class 10 Biology - Reproduction</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background: #020204 !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      touch-action: none;
      position: fixed;
      inset: 0;
      margin: 0 !important;
      padding: 0 !important;
    }

    #unity-container {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      background: #000 !important;
      overflow: hidden !important;
      z-index: 10 !important;
      transform: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      background: #000 !important;
      display: block !important;
      touch-action: none !important;
    }

    /* =========================================================
       IMMERSIVE FULLSCREEN RESPONSIVE SCI-FI LOADING OVERLAY
       ========================================================= */
    #unity-loading-bar {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
      transform: none !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
      z-index: 99999 !important;
      background-color: #050508 !important;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s ease;
      overflow: hidden !important;
    }

    #unity-loading-bar.fade-out {
      opacity: 0 !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }

    /* Immersive Scientific Lab Background Image */
    img.loading-bg-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      pointer-events: none;
    }

    /* Cinematic Lighting Gradient Overlay */
    .loading-overlay-gradient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(18, 14, 26, 0.35) 0%, rgba(8, 7, 14, 0.78) 65%, rgba(2, 2, 5, 0.95) 100%);
      pointer-events: none;
      z-index: 1;
    }

    /* Subtle CRT / Cyber Scanlines Effect */
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.22),
        rgba(0, 0, 0, 0.22) 1.5px,
        transparent 1.5px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 2;
    }

    /* Vignette Edge Shading */
    .vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 140px rgba(0, 0, 0, 0.92);
      pointer-events: none;
      z-index: 3;
    }

    /* Central Content Wrapper (Always 100% Centered) */
    .loading-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 680px;
      padding: 0 24px;
      margin: 0 auto;
      text-align: center;
    }

    /* Top System Status Pill Badge */
    .system-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 18px;
      border-radius: 24px;
      background: rgba(30, 20, 10, 0.78);
      border: 1px solid rgba(245, 158, 11, 0.55);
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.1);
      margin-bottom: 22px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b, 0 0 16px rgba(245, 158, 11, 0.85);
      animation: pulseGlow 1.8s infinite ease-in-out;
    }
    .badge-text {
      color: #fde68a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: "SF Mono", Monaco, "Cascadia Code", "Courier New", monospace;
    }

    /* Main Big Bold Title */
    .main-title {
      color: #ffffff;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 900;
      letter-spacing: 7px;
      text-transform: uppercase;
      margin: 0;
      line-height: 1.1;
      text-align: center;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.35), 0 4px 18px rgba(0, 0, 0, 0.9);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* Gold Subtitle Tag */
    .sub-title {
      color: #f59e0b;
      font-size: clamp(10.5px, 2vw, 13px);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-top: 8px;
      margin-bottom: 40px;
      text-align: center;
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* =========================================================
       SCI-FI BRACKETED PROGRESS BAR (MATCHING REFERENCE IMAGE)
       ========================================================= */
    .progress-container {
      position: relative;
      width: 100%;
      max-width: 580px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    /* Corner Bracket Accents [ and ] */
    .corner-bracket {
      position: absolute;
      width: 10px;
      height: 26px;
      pointer-events: none;
      z-index: 12;
    }
    .bracket-left {
      left: -6px;
      border-left: 2.5px solid #f59e0b;
      border-top: 2.5px solid #f59e0b;
      border-bottom: 2.5px solid #f59e0b;
      box-shadow: -2px 0 8px rgba(245, 158, 11, 0.4);
    }
    .bracket-right {
      right: -6px;
      border-right: 2.5px solid #f59e0b;
      border-top: 2.5px solid #f59e0b;
      border-bottom: 2.5px solid #f59e0b;
      box-shadow: 2px 0 8px rgba(245, 158, 11, 0.4);
    }

    /* The Main Track */
    .progress-track {
      width: 100%;
      height: 16px;
      background: rgba(10, 10, 16, 0.92);
      border: 1.5px solid rgba(245, 158, 11, 0.35);
      border-radius: 3px;
      overflow: hidden;
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 18px rgba(245, 158, 11, 0.15);
      position: relative;
    }

    /* The Smooth Glowing Gold Fill */
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #92400e, #d97706, #f59e0b, #fef08a);
      border-radius: 2px;
      transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.85);
    }

    /* Animated Shimmer Sweep across the Bar */
    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(
        90deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      animation: barShimmer 2.2s infinite ease-in-out;
    }

    /* Below the Bar: Status Message & Percentage */
    .status-row {
      width: 100%;
      max-width: 580px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 14px;
      margin-left: auto;
      margin-right: auto;
      font-family: "SF Mono", Monaco, "Cascadia Code", "Courier New", monospace;
    }

    .status-message {
      color: #cbd5e1;
      font-size: clamp(10px, 1.8vw, 11.5px);
      font-weight: 600;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 82%;
      transition: opacity 0.25s ease;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .status-percent {
      color: #f59e0b;
      font-size: clamp(11.5px, 2vw, 13.5px);
      font-weight: 800;
      letter-spacing: 1.2px;
      min-width: 48px;
      text-align: right;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    /* =========================================================
       COMPACT LOWER-LEFT FULLSCREEN BUTTON (AUTO-HIDES ON FULLSCREEN)
       ========================================================= */
    #fullscreen-btn {
      position: fixed;
      left: 20px;
      bottom: 20px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1.5px solid rgba(245, 158, 11, 0.45);
      background: rgba(15, 18, 25, 0.88);
      color: #fde68a;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 100000;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7), 0 0 12px rgba(245, 158, 11, 0.2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }
    #fullscreen-btn:hover {
      background: rgba(245, 158, 11, 0.2);
      border-color: #f59e0b;
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.85), 0 0 18px rgba(245, 158, 11, 0.5);
    }
    #fullscreen-btn svg {
      width: 18px;
      height: 18px;
    }

    /* Button completely hides whenever in fullscreen */
    body.is-fullscreen #fullscreen-btn,
    #fullscreen-btn.hidden {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    /* Warning Banner */
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      z-index: 100001;
      max-width: 90%;
      text-align: center;
      font-size: 13px;
    }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(1);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.3);
        opacity: 1;
        box-shadow: 0 0 12px #f59e0b, 0 0 20px rgba(245, 158, 11, 0.9);
      }
    }

    @keyframes barShimmer {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(100%);
      }
    }
  </style>
</head>
<body>
  <!-- 3D Canvas Game Viewport Container -->
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>

  <!-- Top-Level Fullscreen Centered Sci-Fi Loading Overlay -->
  <div id="unity-loading-bar">
    <img src="TemplateData/lab_loading_bg.jpg" alt="Lab Background" class="loading-bg-image" />
    <div class="loading-overlay-gradient"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="loading-content">
      <!-- Top Pill Badge -->
      <div class="system-badge">
        <span class="badge-dot"></span>
        <span class="badge-text">SYSTEM ONLINE // WEBGL 6.0</span>
      </div>

      <!-- Main Sci-Fi Titles -->
      <h1 class="main-title">CYBERLAB 3D</h1>
      <div class="sub-title">ASEXUAL REPRODUCTION // VIRTUAL DISCOVERY</div>

      <!-- Bracketed Progress Bar -->
      <div class="progress-container">
        <div class="corner-bracket bracket-left"></div>
        <div class="progress-track">
          <div id="unity-progress-bar-full" class="progress-fill"></div>
        </div>
        <div class="corner-bracket bracket-right"></div>
      </div>

      <!-- Dynamic Status Row -->
      <div class="status-row">
        <div id="dynamic-status-text" class="status-message">CONNECTING TO SECURE CLOUD STORAGE...</div>
        <div id="progress-percent" class="status-percent">0%</div>
      </div>
    </div>
  </div>

  <div id="unity-warning"></div>

  <!-- Compact Lower-Left Fullscreen Button (Auto-Hides on Fullscreen) -->
  <button id="fullscreen-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
  </button>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingOverlay = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var dynamicStatusText = document.querySelector("#dynamic-status-text");
    var progressPercent = document.querySelector("#progress-percent");
    var warningBanner = document.querySelector("#unity-warning");
    var fullscreenBtn = document.querySelector("#fullscreen-btn");
    var unityGameInstance = null;

    // Minimum 14 Dynamic Science & Loading Stages
    var loadingStages = [
      { at: 0,  text: "CONNECTING TO SECURE CLOUD STORAGE..." },
      { at: 7,  text: "VERIFYING HIGH-SPEED CDN HANDSHAKE..." },
      { at: 14, text: "DOWNLOADING 3D LABORATORY ASSETS & TEXTURES..." },
      { at: 22, text: "INITIALIZING WEBGL 2.0 GRAPHICS ENGINE..." },
      { at: 30, text: "COMPILING CELLULAR SHADERS & LIGHTING BUFFERS..." },
      { at: 39, text: "CALIBRATING HIGH-PRECISION DIGITAL MICROSCOPE..." },
      { at: 48, text: "PREPARING ASEXUAL REPRODUCTION SPECIMENS..." },
      { at: 56, text: "MOUNTING AMOEBA & PARAMECIUM FISSION STAGES..." },
      { at: 65, text: "GENERATING HYDRA BUDDING & REGENERATION MODELS..." },
      { at: 73, text: "SIMULATING YEAST CELL DIVISION & SPORE FORMATION..." },
      { at: 81, text: "BUILDING INTERACTIVE CELL NUCLEUS & ORGANELLES..." },
      { at: 88, text: "SYNCHRONIZING AUDIO ENGINE & LAB SFX..." },
      { at: 94, text: "CONFIGURING TOUCH CONTROLS & HUD OVERLAYS..." },
      { at: 98, text: "SYSTEM READY - LAUNCHING VIRTUAL LAB..." }
    ];

    // Sub-stage cycling messages during heavy download phases
    var subStepMessages = [
      "STREAMING HIGH-RESOLUTION TEXTURE ATLAS...",
      "DECOMPRESSING BIOLOGICAL SPECIMEN MESHES...",
      "PRE-CACHING GPU PIPELINE SHADERS...",
      "CALIBRATING IMMERSIVE CELLULAR ENVIRONMENT...",
      "ALLOCATING FAST-ACCESS BROWSER MEMORY BUFFERS..."
    ];
    var currentSubStepIdx = 0;
    var lastProgressVal = 0;
    var lastProgressTime = Date.now();

    function updateLoadingProgress(progress) {
      var pct = Math.min(Math.round(progress * 100), 100);
      progressBarFull.style.width = pct + "%";
      progressPercent.textContent = pct + "%";

      // Find appropriate stage based on percentage
      var activeText = loadingStages[0].text;
      for (var i = 0; i < loadingStages.length; i++) {
        if (pct >= loadingStages[i].at) {
          activeText = loadingStages[i].text;
        }
      }

      // If progress changed, update immediately
      if (pct !== lastProgressVal) {
        lastProgressVal = pct;
        lastProgressTime = Date.now();
        setStatusText(activeText);
      }
    }

    function setStatusText(txt) {
      if (dynamicStatusText.textContent !== txt) {
        dynamicStatusText.style.opacity = "0.3";
        setTimeout(function() {
          dynamicStatusText.textContent = txt;
          dynamicStatusText.style.opacity = "1";
        }, 120);
      }
    }

    // Periodic sub-step cycler: keeps status active even during heavy asset downloads
    setInterval(function() {
      if (!unityGameInstance && (Date.now() - lastProgressTime > 2600)) {
        currentSubStepIdx = (currentSubStepIdx + 1) % subStepMessages.length;
        setStatusText(subStepMessages[currentSubStepIdx]);
      }
    }, 2800);

    function unityShowBanner(msg, type) {
      function updateVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      div.style.padding = '8px 16px';
      div.style.borderRadius = '6px';
      div.style.marginBottom = '6px';
      if (type === 'error') {
        div.style.background = '#ef4444';
        div.style.color = '#fff';
      } else {
        div.style.background = '#f59e0b';
        div.style.color = '#000';
        setTimeout(function() {
          if (div.parentNode) div.parentNode.removeChild(div);
          updateVisibility();
        }, 5000);
      }
      warningBanner.appendChild(div);
      updateVisibility();
    }

    // =========================================================
    // FULLSCREEN HANDLING & LOWER-LEFT BUTTON AUTO-HIDE
    // =========================================================
    function isFullscreenActive() {
      return !!(document.fullscreenElement ||
                document.webkitFullscreenElement ||
                document.mozFullScreenElement ||
                document.msFullscreenElement);
    }

    function updateFullscreenBtnState() {
      var fsActive = isFullscreenActive();
      if (fsActive) {
        document.body.classList.add('is-fullscreen');
        fullscreenBtn.classList.add('hidden');
      } else {
        document.body.classList.remove('is-fullscreen');
        fullscreenBtn.classList.remove('hidden');
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenBtnState);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnState);
    document.addEventListener('mozfullscreenchange', updateFullscreenBtnState);
    document.addEventListener('MSFullscreenChange', updateFullscreenBtnState);

    function toggleFullScreen() {
      var doc = window.document;
      var docEl = doc.documentElement;

      var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!isFullscreenActive()) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl).then(function() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function() {});
            }
          }).catch(function(err) {
            if (unityGameInstance) unityGameInstance.SetFullscreen(1);
          });
        } else if (unityGameInstance) {
          unityGameInstance.SetFullscreen(1);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        } else if (unityGameInstance) {
          unityGameInstance.SetFullscreen(0);
        }
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullScreen);
    fullscreenBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      toggleFullScreen();
    });

    // Auto-request fullscreen on first user touch anywhere on canvas (Mobile device support)
    var hasAttemptedAutoFullscreen = false;
    function onFirstMobileInteraction() {
      if (!hasAttemptedAutoFullscreen) {
        hasAttemptedAutoFullscreen = true;
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile && !isFullscreenActive()) {
          toggleFullScreen();
        }
      }
    }
    window.addEventListener('touchstart', onFirstMobileInteraction, { passive: true, once: true });
    window.addEventListener('click', onFirstMobileInteraction, { passive: true, once: true });

    // Storage / CDN Configuration
    var R2_CDN_URL = "https://pub-3d734cf2e4074ba896ff0e5efd56fd43.r2.dev";
    var buildUrl = (R2_CDN_URL && R2_CDN_URL.indexOf("http") === 0) ? R2_CDN_URL + "/Build" : "Build";
    var streamingUrl = (R2_CDN_URL && R2_CDN_URL.indexOf("http") === 0) ? R2_CDN_URL + "/StreamingAssets" : "StreamingAssets";
    var loaderUrl = "Build/WebGL.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: streamingUrl,
      companyName: "BiologyEdu",
      productName: "Class 10 Biology - Reproduction",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    var isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobileDevice) {
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    }

    function resizeCanvas() {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Prevent pull-to-refresh & pinch zoom on mobile
    document.addEventListener("touchmove", function(e) {
      e.preventDefault();
    }, { passive: false });

    // Initial state check
    updateLoadingProgress(0);
    updateFullscreenBtnState();

    // Load Unity engine
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        updateLoadingProgress(progress);
      }).then((unityInstance) => {
        unityGameInstance = unityInstance;
        updateLoadingProgress(1.0);
        setStatusText("SYSTEM READY - LAUNCHING VIRTUAL LAB...");

        // Smooth fade out of sci-fi loading overlay
        setTimeout(function() {
          loadingOverlay.classList.add("fade-out");
          setTimeout(function() {
            loadingOverlay.style.display = "none";
            if (fullscreenBtn) fullscreenBtn.style.display = "none";
          }, 650);
        }, 500);

      }).catch((message) => {
        alert("Unity load error: " + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
