<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=no, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover">
  <title>Class 10 Biology - Reproduction | 3D Interactive Laboratory</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
    }
    #unity-container {
      position: fixed;
      width: 100vw;
      height: 100vh;
      left: 0;
      top: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      background: #000;
      display: block;
      touch-action: none;
    }
    #unity-loading-bar {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
      background: rgba(13, 17, 23, 0.90);
      padding: 24px 32px;
      border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
    }
    .loading-title {
      color: #38bdf8;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .loading-subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 14px;
    }
    #unity-progress-bar-empty {
      width: 240px;
      height: 12px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
      border-radius: 6px;
      transition: width 0.2s ease;
    }
    #loading-text {
      color: #e2e8f0;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }
    #unity-warning {
      position: absolute;
      left: 50%;
      top: 15px;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 90%;
      text-align: center;
      font-size: 13px;
    }
    /* Floating Mobile & Desktop Fullscreen Button */
    #mobile-fullscreen-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid rgba(56, 189, 248, 0.6);
      color: #38bdf8;
      padding: 10px 18px;
      border-radius: 28px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }
    #mobile-fullscreen-btn:hover, #mobile-fullscreen-btn:active {
      background: rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
      color: #ffffff;
      transform: scale(1.05);
    }
    #mobile-fullscreen-btn svg {
      width: 16px;
      height: 16px;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div class="loading-title">Class 10 Biology - Reproduction</div>
      <div class="loading-subtitle">How Do Organisms Reproduce? - 3D Laboratory</div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="loading-text">Loading virtual lab (0%)...</div>
    </div>
    <div id="unity-warning"></div>
    <button id="mobile-fullscreen-btn" title="Tap for Fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      <span>FULLSCREEN</span>
    </button>
  </div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var loadingText = document.querySelector("#loading-text");
    var warningBanner = document.querySelector("#unity-warning");
    var fullscreenBtn = document.querySelector("#mobile-fullscreen-btn");
    var unityGameInstance = null;

    function unityShowBanner(msg, type) {
      function updateVisibility() {
        warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
      }
      var div = document.createElement('div');
      div.innerHTML = msg;
      div.style.padding = '8px 16px';
      div.style.borderRadius = '6px';
      div.style.marginBottom = '6px';
      if (type === 'error') {
        div.style.background = '#ef4444';
        div.style.color = '#fff';
      } else {
        div.style.background = '#f59e0b';
        div.style.color = '#000';
        setTimeout(function() {
          if (div.parentNode) div.parentNode.removeChild(div);
          updateVisibility();
        }, 5000);
      }
      warningBanner.appendChild(div);
      updateVisibility();
    }

    // Direct Browser DOM Fullscreen & Landscape Orientation Lock
    function toggleFullScreen() {
      var doc = window.document;
      var docEl = doc.documentElement;

      var requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      var cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl).then(function() {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(function() {});
            }
          }).catch(function(err) {
            if (unityGameInstance) unityGameInstance.SetFullscreen(1);
          });
        } else if (unityGameInstance) {
          unityGameInstance.SetFullscreen(1);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        } else if (unityGameInstance) {
          unityGameInstance.SetFullscreen(0);
        }
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullScreen);
    fullscreenBtn.addEventListener('touchend', function(e) {
      e.preventDefault();
      toggleFullScreen();
    });

    // Auto-request fullscreen on first user touch anywhere on canvas (Mobile Chrome support)
    var hasAttemptedAutoFullscreen = false;
    function onFirstMobileInteraction() {
      if (!hasAttemptedAutoFullscreen) {
        hasAttemptedAutoFullscreen = true;
        var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile && !document.fullscreenElement) {
          toggleFullScreen();
        }
      }
    }
    window.addEventListener('touchstart', onFirstMobileInteraction, { passive: true, once: true });
    window.addEventListener('click', onFirstMobileInteraction, { passive: true, once: true });

    // Storage / CDN Configuration
    var R2_CDN_URL = "https://pub-3d734cf2e4074ba896ff0e5efd56fd43.r2.dev";
    var buildUrl = (R2_CDN_URL && R2_CDN_URL.indexOf("http") === 0) ? R2_CDN_URL + "/Build" : "Build";
    var streamingUrl = (R2_CDN_URL && R2_CDN_URL.indexOf("http") === 0) ? R2_CDN_URL + "/StreamingAssets" : "StreamingAssets";
    var loaderUrl = "Build/WebGL.loader.js";

    var config = {
      arguments: [],
      dataUrl: buildUrl + "/WebGL.data.unityweb",
      frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb",
      codeUrl: buildUrl + "/WebGL.wasm.unityweb",
      streamingAssetsUrl: streamingUrl,
      companyName: "BiologyEdu",
      productName: "Class 10 Biology - Reproduction",
      productVersion: "0.1.0",
      showBanner: unityShowBanner,
    };

    var isMobileDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobileDevice) {
      config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    }

    function resizeCanvas() {
      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Prevent pull-to-refresh & pinch zoom on mobile
    document.addEventListener("touchmove", function(e) {
      e.preventDefault();
    }, { passive: false });

    // Load Unity engine
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        var pct = Math.round(100 * progress);
        progressBarFull.style.width = pct + "%";
        loadingText.textContent = "Loading 3D Laboratory (" + pct + "%)...";
      }).then((unityInstance) => {
        unityGameInstance = unityInstance;
        loadingBar.style.display = "none";
      }).catch((message) => {
        alert("Unity load error: " + message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
